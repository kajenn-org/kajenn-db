name: Tests

"on":
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  # Daily run against the latest kajenn and backend releases: a change
  # published upstream surfaces here without a push.
  schedule:
    - cron: '0 5 * * *'

jobs:
  test:
    name: pytest + ruff (Linux/glibc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov upload with OIDC
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GNR_TEST_PG_HOST: 127.0.0.1
      GNR_TEST_PG_PORT: '5432'
      GNR_TEST_PG_USER: postgres
      GNR_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project with all extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,asqueel,sqlalchemy,django]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Tests
        run: pytest tests/ --cov=kajenn_db --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
